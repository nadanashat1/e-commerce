name: Redirect legacy Surge demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish redirect to the database-backed demo
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          mkdir redirect
          cat > redirect/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="refresh" content="0;url=https://ecommerce-nada.vercel.app/"><title>E-Commerce demo moved</title></head><body><p>The database-backed demo has moved to <a href="https://ecommerce-nada.vercel.app/">ecommerce-nada.vercel.app</a>.</p></body></html>
          HTML
          cp redirect/index.html redirect/200.html
          cp redirect/index.html redirect/404.html
          npx --yes surge@0.24.6 redirect e-commerce-template.surge.sh
